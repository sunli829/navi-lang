name: ci

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: linux-x64, os: ubuntu-latest }
          - { target: linux-arm64, os: ubuntu-24.04-arm }
          - { target: macos-arm64, os: macos-latest }
          - { target: macos-x64, os: macos-15-intel }
          - { target: windows-x64, os: windows-latest }
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go vet ./...
      # Native golden tests run for the host target (internal/build).
      - run: go test ./...
      # Apple Silicon runners also test x64 binaries under Rosetta 2.
      - if: matrix.target == 'macos-arm64'
        run: NAVI_TEST_TARGET=macos-x64 go test -count=1 ./internal/build

  cross:
    # Every target's object file is generated from one host.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go build -o navi ./cmd/navi
      - run: |
          for t in macos-arm64 macos-x64 linux-x64 linux-arm64 windows-x64; do
            ./navi build --target $t -c -o run-$t.o tests/run/structs.navi
          done
          file run-*.o
