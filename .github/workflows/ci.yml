name: ci

on:
  push:
  pull_request:

jobs:
  # navi on each Unix target: bootstrapped from the release in
  # tools/bootstrap-version (tools/bootstrap.sh: stage1, stage2 and stage3,
  # stage2 and stage3 byte for byte the same), then the golden tests in
  # tests/run (built and run) in several runtime modes.
  navi:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: linux-x64, os: ubuntu-latest }
          - { target: linux-arm64, os: ubuntu-24.04-arm }
          - { target: macos-arm64, os: macos-latest }
          - { target: macos-x64, os: macos-15-intel }
    name: navi ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      # A build cache of the job's own: the crates (std first) are compiled
      # once and reused by every program and test (docs/crates.md).
      - name: cache
        shell: bash
        run: echo "NAVI_CACHE=$RUNNER_TEMP/navi-cache" >> "$GITHUB_ENV"
      - name: bootstrap
        run: |
          tools/bootstrap.sh "$PWD/b"
          mkdir -p s2
          cp b/stage2/navi s2/navi
      # install.sh: the latest release into a directory of its own, then a
      # program built and run with it (NAVI_STD unset: next to navi).
      - name: install.sh
        if: ${{ !cancelled() }}
        run: |
          NAVI_HOME=$RUNNER_TEMP/navi-home sh install.sh
          printf 'fn main() { println("installed"); }\n' > $RUNNER_TEMP/hello.navi
          [ "$(env -u NAVI_STD -u NAVI_CACHE $RUNNER_TEMP/navi-home/bin/navi run $RUNNER_TEMP/hello.navi | tail -1)" = installed ]
      - name: Windows compiler (cross-built)
        if: matrix.target == 'linux-x64'
        run: NAVI_STD=$PWD/lib/std s2/navi build --target windows-x64 -o navi.exe compiler
      - name: tests
        run: NAVI_STD=$PWD/lib/std tools/test.sh s2/navi
      - name: tests, one thread
        if: ${{ !cancelled() }}
        run: NAVI_STD=$PWD/lib/std NAVI_MAXPROCS=1 tools/test.sh s2/navi
      - name: tests, collector verification
        if: ${{ !cancelled() }}
        run: NAVI_STD=$PWD/lib/std NAVI_DEBUG=gcverify tools/test.sh s2/navi
      - name: tests, stacks moved at every growth
        if: ${{ !cancelled() }}
        run: NAVI_STD=$PWD/lib/std NAVI_DEBUG=stackmove NAVI_MAXPROCS=16 tools/test.sh s2/navi
      - name: determinism, std on every target
        if: ${{ !cancelled() && matrix.target == 'linux-x64' }}
        run: |
          export NAVI_STD=$PWD/lib/std
          # (Without the cache: both builds compile everything.)
          export NAVI_CACHE=off
          mkdir -p d1 d16
          NAVI_MAXPROCS=1 s2/navi build -o d1/navi compiler
          NAVI_MAXPROCS=16 s2/navi build -o d16/navi compiler
          cmp d1/navi d16/navi
          printf 'fn main() {}\n' > empty.navi
          for t in macos-arm64 macos-x64 linux-x64 linux-arm64 windows-x64; do
            s2/navi build -d checkstd --target $t -o empty-$t empty.navi
          done

  # Windows: bootstrapped there from the release's Windows build (as the
  # Unix targets), in parallel with them; the golden tests.
  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      # A build cache of the job's own: the crates (std first) are compiled
      # once and reused by every program and test (docs/crates.md).
      - name: cache
        shell: bash
        run: echo "NAVI_CACHE=$RUNNER_TEMP/navi-cache" >> "$GITHUB_ENV"
      - name: bootstrap
        run: |
          tools/bootstrap.sh "$PWD/b"
          cp b/stage2/navi.exe navi.exe
      # install.ps1, as install.sh on the Unix targets.
      - name: install.ps1
        if: ${{ !cancelled() }}
        shell: pwsh
        run: |
          $env:NAVI_HOME = Join-Path $env:RUNNER_TEMP "navi-home"
          ./install.ps1
          Set-Content -Path (Join-Path $env:RUNNER_TEMP "hello.navi") -Value 'fn main() { println("installed"); }'
          Remove-Item Env:NAVI_STD -ErrorAction SilentlyContinue
          Remove-Item Env:NAVI_CACHE -ErrorAction SilentlyContinue
          # (A relative path: v0.0.5 took D:\...\hello.navi whole for the name.)
          Set-Location $env:RUNNER_TEMP
          $out = & (Join-Path $env:NAVI_HOME "bin\navi.exe") run hello.navi
          if (($out | Select-Object -Last 1) -ne "installed") { throw "installed navi: $out" }
      # A file named by a Windows path (drive, backslashes).
      - name: a Windows path
        run: |
          printf 'fn main() { println("windows path"); }\n' > "$RUNNER_TEMP/winpath.navi"
          [ "$(NAVI_STD=$(cygpath -m "$PWD/lib/std") ./navi.exe run "$(cygpath -w "$RUNNER_TEMP/winpath.navi")" | tail -1)" = "windows path" ]
      - name: tests
        run: NAVI_STD=$(cygpath -m "$PWD/lib/std") tools/test.sh ./navi.exe
      - name: tests, one thread
        if: ${{ !cancelled() }}
        run: NAVI_STD=$(cygpath -m "$PWD/lib/std") NAVI_MAXPROCS=1 tools/test.sh ./navi.exe
      - name: tests, collector verification
        if: ${{ !cancelled() }}
        run: NAVI_STD=$(cygpath -m "$PWD/lib/std") NAVI_DEBUG=gcverify tools/test.sh ./navi.exe
      - name: tests, stacks moved at every growth
        if: ${{ !cancelled() }}
        run: NAVI_STD=$(cygpath -m "$PWD/lib/std") NAVI_DEBUG=stackmove NAVI_MAXPROCS=16 tools/test.sh ./navi.exe
      # Crashes: the exception, registers and stack from cdb (addresses
      # are read with a link map: navi build -d linkmap=file ...).
      - name: crash stacks
        if: failure()
        run: |
          cdb="/c/Program Files (x86)/Windows Kits/10/Debuggers/x64/cdb.exe"
          if [ ! -x "$cdb" ]; then echo "no cdb"; ls "/c/Program Files (x86)/Windows Kits/10/" || true; exit 0; fi
          export NAVI_STD=$(cygpath -m "$PWD/lib/std")
          for i in 1 2 3; do
            echo "=== navi build unreachable ($i)"
            "$cdb" -g -G -c ".lastevent; r; kn 40; dps @rsp L100; q" ./navi.exe build -o x-basics.exe tests/ui/unreachable.navi 2>&1 | tail -60
          done
          echo "=== basics.exe"
          "$cdb" -g -G -c ".lastevent; r; kn 40; dps @rsp L100; q" ./x-basics.exe 2>&1 | tail -60 || true

  # A pushed tag v*: once every target passed, navi for the 5 targets
  # (cross-built on Linux: the builds are the same as on each target) with
  # std, as navi-TAG-TARGET.tar.gz (zip for Windows): bin/navi and lib/std,
  # where navi looks for std.
  release:
    needs: [navi, windows]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      # A build cache of the job's own: the crates (std first) are compiled
      # once and reused by every program and test (docs/crates.md).
      - name: cache
        shell: bash
        run: echo "NAVI_CACHE=$RUNNER_TEMP/navi-cache" >> "$GITHUB_ENV"
      - name: bootstrap
        run: |
          tools/bootstrap.sh "$PWD/b"
          mkdir -p s2
          cp b/stage2/navi s2/navi
      - name: package
        run: |
          export NAVI_STD=$PWD/lib/std
          mkdir dist
          for t in macos-arm64 macos-x64 linux-x64 linux-arm64 windows-x64; do
            d=navi-$GITHUB_REF_NAME-$t
            exe=navi
            if [ $t = windows-x64 ]; then exe=navi.exe; fi
            mkdir -p $d/bin $d/lib
            s2/navi build --target $t -o $d/bin/$exe compiler
            cp -R lib/std $d/lib/std
            cp README.md $d/
            if [ $t = windows-x64 ]; then zip -qr dist/$d.zip $d; else tar czf dist/$d.tar.gz $d; fi
          done
          (cd dist && sha256sum * > SHA256SUMS)
          ls -la dist
      - name: publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --title "$GITHUB_REF_NAME" --generate-notes
