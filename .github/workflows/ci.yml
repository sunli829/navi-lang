name: ci

on:
  push:
  pull_request:

jobs:
  # navic on each Unix target: bootstrapped from the release in
  # tools/bootstrap-version (tools/bootstrap.sh: stage1, stage2 and stage3,
  # stage2 and stage3 byte for byte the same), then the golden tests in
  # tests/run (built and run) in several runtime modes.
  navic:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: linux-x64, os: ubuntu-latest }
          - { target: linux-arm64, os: ubuntu-24.04-arm }
          - { target: macos-arm64, os: macos-latest }
          - { target: macos-x64, os: macos-15-intel }
    name: navic ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    env:
      NAVI_CACHE: "off"
    steps:
      - uses: actions/checkout@v4
      - name: bootstrap
        run: |
          tools/bootstrap.sh "$PWD/b"
          mkdir -p s2
          cp b/stage2/navic s2/navic
      - name: Windows compiler
        if: matrix.target == 'linux-x64'
        run: NAVI_STD=$PWD/lib/std NAVI_TARGET=windows-x64 s2/navic build -o navic.exe compiler
      - if: matrix.target == 'linux-x64'
        uses: actions/upload-artifact@v4
        with:
          name: navic-windows-x64
          path: navic.exe
      - name: tests
        run: NAVI_STD=$PWD/lib/std tools/navictest.sh s2/navic
      - name: tests, one thread
        if: ${{ !cancelled() }}
        run: NAVI_STD=$PWD/lib/std NAVI_MAXPROCS=1 tools/navictest.sh s2/navic
      - name: tests, collector verification
        if: ${{ !cancelled() }}
        run: NAVI_STD=$PWD/lib/std NAVI_GCVERIFY=1 tools/navictest.sh s2/navic
      - name: tests, stacks moved at every growth
        if: ${{ !cancelled() }}
        run: NAVI_STD=$PWD/lib/std NAVI_STACKMOVE=1 NAVI_MAXPROCS=16 tools/navictest.sh s2/navic
      - name: determinism, std on every target
        if: ${{ !cancelled() && matrix.target == 'linux-x64' }}
        run: |
          export NAVI_STD=$PWD/lib/std
          mkdir -p d1 d16
          NAVI_MAXPROCS=1 s2/navic build -o d1/navic compiler
          NAVI_MAXPROCS=16 s2/navic build -o d16/navic compiler
          cmp d1/navic d16/navic
          printf 'fn main() {}\n' > empty.navi
          for t in macos-arm64 macos-x64 linux-x64 linux-arm64 windows-x64; do
            NAVI_CHECK_STD=1 NAVI_TARGET=$t s2/navic build -o empty-$t empty.navi
          done

  # navic.exe (cross-built by the Linux job with navic's own PE linker) runs
  # the golden tests on Windows.
  windows:
    needs: navic
    if: ${{ !cancelled() }}
    runs-on: windows-latest
    env:
      NAVI_CACHE: "off"
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: navic-windows-x64
      - name: tests
        run: NAVI_STD=$(cygpath -m "$PWD/lib/std") tools/navictest.sh ./navic.exe
      # Crashes: the exception, registers and stack from cdb (addresses
      # are read with a link map: NAVI_LINKMAP=file navic build ...).
      - name: crash stacks
        if: failure()
        run: |
          cdb="/c/Program Files (x86)/Windows Kits/10/Debuggers/x64/cdb.exe"
          if [ ! -x "$cdb" ]; then echo "no cdb"; ls "/c/Program Files (x86)/Windows Kits/10/" || true; exit 0; fi
          export NAVI_STD=$(cygpath -m "$PWD/lib/std")
          for f in atomic basics btree_map; do
            for i in 1 2 3; do
              echo "=== navic build $f ($i)"
              "$cdb" -g -G -c ".lastevent; r; kn 40; dps @rsp L100; q" ./navic.exe build -o "x-$f.exe" "tests/run/$f.navi" 2>&1 | tail -60
            done
          done
          for f in compress goroutines c_callback btree_map; do
            echo "=== $f.exe"
            ./navic.exe build -o "p-$f.exe" "tests/run/$f.navi" && "$cdb" -g -G -c ".lastevent; r; kn 40; dps @rsp L100; q" "./p-$f.exe" 2>&1 | tail -60
          done

  # A pushed tag v*: once every target passed, navic for the 5 targets
  # (cross-built on Linux: the builds are the same as on each target) with
  # std, as navi-TAG-TARGET.tar.gz (zip for Windows): bin/navic and lib/std,
  # where navic looks for std.
  release:
    needs: [navic, windows]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      NAVI_CACHE: "off"
    steps:
      - uses: actions/checkout@v4
      - name: bootstrap
        run: |
          tools/bootstrap.sh "$PWD/b"
          mkdir -p s2
          cp b/stage2/navic s2/navic
      - name: package
        run: |
          export NAVI_STD=$PWD/lib/std
          mkdir dist
          for t in macos-arm64 macos-x64 linux-x64 linux-arm64 windows-x64; do
            d=navi-$GITHUB_REF_NAME-$t
            exe=navic
            if [ $t = windows-x64 ]; then exe=navic.exe; fi
            mkdir -p $d/bin $d/lib
            NAVI_TARGET=$t s2/navic build -o $d/bin/$exe compiler
            cp -R lib/std $d/lib/std
            cp README.md $d/
            if [ $t = windows-x64 ]; then zip -qr dist/$d.zip $d; else tar czf dist/$d.tar.gz $d; fi
          done
          (cd dist && sha256sum * > SHA256SUMS)
          ls -la dist
      - name: publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --title "$GITHUB_REF_NAME" --generate-notes
