name: ci

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: linux-x64, os: ubuntu-latest }
          - { target: linux-arm64, os: ubuntu-24.04-arm }
          - { target: macos-arm64, os: macos-latest }
          # Intel macOS: macos-13 is retired. Check the label GitHub still offers
          # before M5; if none is left, run x64 binaries under Rosetta 2 instead.
          - { target: macos-x64, os: macos-15-intel }
          - { target: windows-x64, os: windows-latest }
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go test ./...
